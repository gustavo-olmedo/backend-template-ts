services:
  nest-backend:
    build: .
    container_name: nest-backend
    working_dir: /app
    command: >
      sh -lc "yarn install --frozen-lockfile --check-files &&
              yarn start:dev"
    ports:
      - '8000:3000'
    environment:
      - NODE_ENV=development
      # These help file-watching on Windows/macOS bind mounts.
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=800
      - WATCHPACK_POLLING=true # <- helps Nest’s webpack-based watch
      - TSC_WATCHFILE=UsePolling # <- helps TypeScript watchers in containers
      # Uncomment only if you ever need to force a target (usually not needed):
      # - npm_config_platform=linux
      # - npm_config_arch=arm64
    volumes:
      - .:/app # your source code
      - node_modules:/app/node_modules # keep deps INSIDE container (fixes sharp)
    depends_on:
      - db

  db:
    image: postgres:16-bookworm
    container_name: nest-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    ports:
      - '5432:5432'
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init_testdb.sql:/docker-entrypoint-initdb.d/init.sql:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: nest-pgadmin4
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=pgadmin4
    ports:
      - '5050:80'
    depends_on:
      - db

volumes:
  node_modules:
  pgdata:
